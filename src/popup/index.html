<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Voice Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 340px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #60a5fa;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      transition: background-color 0.15s;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .section {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    select, input[type="text"] {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: #60a5fa;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #3b82f6;
    }

    .range-val {
      font-size: 12px;
      color: #94a3b8;
      width: 32px;
      text-align: right;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .toggle-row label {
      margin: 0;
      cursor: pointer;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .2s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .btn-test {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-test:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
      margin-top: 8px;
    }

    .shortcut-kbd {
      background: #1e293b;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <span>Site Voice</span>
    </div>
    <div class="status-badge" id="server-status-badge">
      <span class="status-dot" id="server-status-dot"></span>
      <span id="server-status-text">Checking...</span>
    </div>
  </div>

  <button class="btn-primary" id="btn-read-page">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5 3 19 12 5 21 5 3"></polygon>
    </svg>
    <span>Read Current Page</span>
  </button>

  <div class="section">
    <div class="section-title">Voice & Speed</div>
    <div class="form-group">
      <label for="select-voice">Kokoro Voice</label>
      <select id="select-voice"></select>
      <button class="btn-test" id="btn-test-voice">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Preview Voice</span>
      </button>
    </div>

    <div class="form-group" style="margin-top: 10px;">
      <label for="range-speed">Default Speed</label>
      <div class="range-row">
        <input type="range" id="range-speed" min="0.75" max="2.0" step="0.05" value="1.0" />
        <span class="range-val" id="val-speed">1.0x</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Technical Articles & Code</div>
    <div class="form-group">
      <label for="select-code-treatment">Code Blocks Treatment</label>
      <select id="select-code-treatment">
        <option value="skip">Skip Code Blocks (Default)</option>
        <option value="summarize">Summarize (e.g. "12 lines of Python")</option>
        <option value="verbatim">Read Verbatim</option>
      </select>
    </div>

    <div class="toggle-row">
      <label for="toggle-highlight">Karaoke Highlight & Scroll</label>
      <label class="switch">
        <input type="checkbox" id="toggle-highlight" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Server Endpoint</div>
    <div class="form-group">
      <input type="text" id="input-server-url" value="http://localhost:8880" placeholder="http://localhost:8880" />
    </div>
  </div>

  <div class="footer">
    Shortcut: <span class="shortcut-kbd">Alt + Shift + V</span> to read/pause.<br/>
    Highlight any text to read selection.
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
